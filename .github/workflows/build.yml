# Builds and pushes both extension images on version tags (and on demand).
# The tag must equal v<base manifest version>; check-versions enforces the
# base/nvidia lockstep and the Kata pairing before anything builds.
#
# Disk note: the nvidia image is ~1.7 GB uncompressed and its build stage
# extracts the ~1.5 GB kata-static tarball — the free-disk-space step keeps
# the default GitHub runner (~14 GB free) out of trouble.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      base_version: ${{ steps.versions.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency gate
        run: make check-versions
      - id: versions
        run: echo "base=$(make -s print-versions | awk '/BASE_VERSION/{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Tag matches base manifest version
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME}" = "v${{ steps.versions.outputs.base }}" || {
            echo "FAIL: tag ${GITHUB_REF_NAME} != manifest v${{ steps.versions.outputs.base }}"; exit 1; }

  build:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [base, nvidia]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          swap-storage: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.target }}
        run: make ${{ matrix.target }} PUSH=true
