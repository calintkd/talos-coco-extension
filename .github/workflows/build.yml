# Builds both extension images. Publishing happens ONLY on version tags:
# the tag must equal v<base manifest version>, check-versions enforces the
# base/nvidia lockstep + Kata pairing, and a pre-push check refuses to
# overwrite a tag that already exists on ghcr (published artifacts are
# immutable — bump the version instead). workflow_dispatch builds without
# pushing (CI smoke).
#
# Disk note: the nvidia image is ~1.7 GB uncompressed and its build stage
# extracts the ~1.5 GB kata-static tarball — the free-disk-space step keeps
# the default GitHub runner (~14 GB free) out of trouble.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency gate
        run: make check-versions
      - name: Tag matches base manifest version
        if: github.ref_type == 'tag'
        run: |
          base=$(make -s print-versions | awk '/^BASE_VERSION/{print $3}')
          test "${GITHUB_REF_NAME}" = "v${base}" || {
            echo "FAIL: tag ${GITHUB_REF_NAME} != manifest v${base}"; exit 1; }

  build:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [base, nvidia]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          swap-storage: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published tag
        if: github.ref_type == 'tag'
        run: |
          key=$(echo "${{ matrix.target }}" | tr a-z A-Z)_VERSION
          img=$(make -s print-versions | awk -v k="$key" '$1==k{print $NF}')
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "FAIL: $img already exists on the registry — bump the version instead of overwriting"
            exit 1
          fi
          echo "OK: $img is unpublished"
      - name: Build ${{ matrix.target }} (push only on tags)
        run: make ${{ matrix.target }} PUSH=${{ github.ref_type == 'tag' }}
