version: v1alpha1
metadata:
  name: coco-kata-containers
  version: 1.6.0
  author: CoCo Extension (custom)
  description: |
    Confidential Containers (CoCo) runtime extension for Talos Linux.
    Based on Kata Containers 3.32.0. Provides containerd-shim-kata-v2,
    QEMU with SEV-SNP support, virtiofsd, the confidential guest kernel
    and image, AMDSEV.fd OVMF firmware, and the QEMU datadir.
    Registers the kata-qemu-snp and kata-qemu-coco-dev runtime handlers.
    Non-confidential cloud-hypervisor Kata is not included: the official
    siderolabs/kata-containers extension provides it.
    NVIDIA GPU passthrough support is provided by the companion add-on
    extension coco-kata-nvidia-gpu from the same release.
  compatibility:
    talos:
      version: ">= v1.13.0"
