version: v1alpha1
metadata:
  name: coco-kata-containers
  version: 1.3.0
  author: CoCo Extension (custom)
  description: |
    Confidential Containers (CoCo) runtime extension for Talos Linux.
    Based on Kata Containers 3.32.0. Provides containerd-shim-kata-v2,
    QEMU with SEV-SNP support, cloud-hypervisor, virtiofsd, guest kernels,
    confidential guest images, and QEMU firmware blobs.
    Registers kata-qemu-snp, kata-qemu-coco-dev, and kata-clh runtime
    handlers (kata-clh was named kata before v1.3.0).
    NVIDIA GPU passthrough support is provided by the companion add-on
    extension coco-kata-nvidia-gpu from the same release.
  compatibility:
    talos:
      version: ">= v1.13.0"
