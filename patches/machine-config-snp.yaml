# =============================================================================
# Talos machine configuration patch — SNP node (control plane or CPU worker)
# =============================================================================
# For every node that runs the base CoCo extension. GPU workers use
# machine-config-gpu-worker.yaml INSTEAD (it is a superset of this file).
#
# Apply with:
#   talosctl gen config ... --config-patch @patches/machine-config-snp.yaml
#
# The extensions themselves are NOT listed here: they are baked into the
# installer image at build time (`make installer-cpu` / imager
# --system-extension-image ...) and delivered via `talosctl upgrade --image`.
# =============================================================================

machine:
  # Label the node for RuntimeClass scheduling (deploy/runtime-classes.yaml
  # selects on these). machine.nodeLabels are re-applied on every boot and
  # survive re-provisioning, unlike `kubectl label`.
  nodeLabels:
    katacontainers.io/kata-runtime: "true"
    coco.confidentialcontainers.org/snp: "true"    # only on SEV-SNP bare-metal

  # KVM + SEV. NOTE these are inert on a stock Talos kernel: CONFIG_KVM_AMD,
  # CONFIG_KVM_AMD_SEV and CONFIG_CRYPTO_DEV_CCP are all built in (=y), so both
  # initialise during kernel init, before machined reads this config — SNP works
  # with or without these lines (verified on EPYC 9355: neither appears in
  # /proc/modules, and dmesg shows `kvm_amd: SEV-SNP enabled` and `ccp: sev
  # enabled` seconds before machined starts). They are kept as a declaration of
  # intent, and as insurance if a future Talos kernel builds either as =m.
  # Do not read their presence here as the reason SNP is available.
  kernel:
    modules:
      - name: kvm_amd
      - name: ccp          # AMD Cryptographic Co-processor (provides /dev/sev)
